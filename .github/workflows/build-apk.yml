name: Build Android APK - DIADJI FAMILY

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package DIADJI FAMILY APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          chmod +x gradlew || true

      - name: Build Android APK (Debug & Release)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/DIADJI_FAMILY.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIADJI_FAMILY_Android_APK
          path: output_apk/DIADJI_FAMILY.apk
          if-no-files-found: error
